<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Zen Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #3b2a1e; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: crosshair; }
  .bar { position: fixed; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #tools { left: 8px; right: 8px; bottom: 12px; }
  .bar button, .snd {
    font: 700 18px 'Gaegu', ui-monospace, monospace; color: #fff1dc; background: rgba(40, 26, 16, .78);
    border: 1px dashed rgba(255, 225, 185, .4); border-radius: 18px; padding: 3px 13px 5px; cursor: pointer;
  }
  .bar button.on { background: rgba(170, 120, 70, .55); border: 1px solid rgba(255, 230, 195, .85); }
  .bar button small { opacity: .55; font-size: 13px; }
  .snd { display: flex; align-items: center; gap: 8px; cursor: default; }
  .snd span { min-width: 72px; }
  #vol { width: 90px; accent-color: #c9a26b; }
  #count { position: fixed; top: 10px; right: 14px; font: 700 20px 'Gaegu', ui-monospace, monospace; color: #fff1dc;
    background: rgba(40, 26, 16, .65); padding: 2px 14px 4px; border-radius: 16px; }
  #clock { position: fixed; top: 10px; left: 14px; font: 700 20px 'Gaegu', ui-monospace, monospace; color: #fff1dc;
    background: rgba(40, 26, 16, .65); padding: 2px 14px 4px; border-radius: 16px; }
  #toast { position: fixed; left: 50%; top: 52px; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    font: 700 21px 'Gaegu', ui-monospace, monospace; color: #fff6e8; background: rgba(90, 62, 38, .9);
    padding: 4px 16px 6px; border-radius: 20px; transition: opacity .4s, transform .4s; white-space: nowrap; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 700px) { #clock, #count { font-size: 16px; padding: 1px 10px 3px; top: 6px; } #clock { left: 8px; } #count { right: 8px; } .bar { gap: 5px; } #tools { bottom: 8px; } .bar button, .snd { font-size: 15px; padding: 2px 9px 4px; } .bar button small { display: none; } #vol { width: 66px; } .snd span { min-width: 56px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="clock"></div>
<div id="count"></div>
<div class="bar" id="tools">
  <button data-tool="rake" class="on">rake <small>1</small></button>
  <button data-tool="fine">fine rake <small>2</small></button>
  <button data-tool="smooth">smooth <small>3</small></button>
  <button id="leavesBtn">fresh leaves</button>
  <button id="resetBtn">start over</button>
  <label class="snd"><span id="sndLbl">sound off</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0" aria-label="sound volume"></label>
</div>
<div id="toast"></div>
<script>
(() => {
  const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  const STORE = 'ascii-zen-garden-v2';
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(STORE) || '{}') || {}; } catch (e) {}
  const prefs = Object.assign({ volume: 0, seed: (Math.random() * 1e9) | 0 }, saved.prefs || {});
  try { const old = JSON.parse(localStorage.getItem('ascii-zen-garden-v1') || '{}'); if (old.prefs && saved.prefs === undefined) prefs.volume = old.prefs.volume || 0; } catch (e) {}

  // ---------- helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  function seeded(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const mixCache = new Map();
  function mix(a, b, t) {
    t = Math.max(0, Math.min(1, Math.round(t * 20) / 20)); if (t === 0) return a; if (t === 1) return b;
    const k = a + b + t; let v = mixCache.get(k);
    if (!v) { const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
      const f = s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t).toString(16).padStart(2, '0');
      v = '#' + f(16) + f(8) + f(0); mixCache.set(k, v); }
    return v;
  }

  // ---------- grid of characters ----------
  const FONT_PX = 12;
  let cw, ch, cols, rows, cellCh, cellCol, cellPri;
  function put(gx, gy, c, col, pri) { gx |= 0; gy |= 0; if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) return; const i = gy * cols + gx; if (pri > cellPri[i]) { cellPri[i] = pri; cellCh[i] = c; cellCol[i] = col; } }

  // ---------- time of day ----------
  function hourNow() { let o = null; try { o = localStorage.getItem('zen-hour'); } catch (e) {} if (o) return +o; const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
  function daylight() { const h = hourNow(); if (h >= 8 && h < 17) return 1; if (h >= 6 && h < 8) return (h - 6) / 2; if (h >= 17 && h < 19.5) return 1 - (h - 17) / 2.5; return 0; }
  function warmth() { const h = hourNow(); return Math.max(0, 1 - Math.abs(h - 7) / 1.4) + Math.max(0, 1 - Math.abs(h - 18) / 1.4); }
  let day = daylight(), warm = Math.min(1, warmth());

  // ---------- the view: a sand garden seen from the front, in perspective ----------
  // Ground coordinates: X (left/right, in "near pixels") and Z (depth: 1 = front edge, ZF = back edge).
  let ZF = 4.2;
  let yH, yB, cx, WN, DEPTH;      // horizon y, front edge y, centre x (px), front width (px), depth scale
  function toScreen(X, z) { return { x: cx + X / z, y: yH + (yB - yH) / z }; }
  function toGround(sx, sy) { if (sy <= yH + 1) return null; const z = (yB - yH) / (sy - yH); return { X: (sx - cx) * z, z }; }
  // where the sand is (a trapezoid that narrows toward the back)
  const halfW = () => WN * 0.5;
  function onSand(X, z) { return z >= 1 && z <= ZF && Math.abs(X) <= halfW(); }
  // physical ground position used for raking (so grooves have even spacing on the ground)
  const gY = z => z * DEPTH;

  // ---------- groove storage: a grid laid on the ground ----------
  const GW = 220, GH = 130;
  let groove = new Uint8Array(GW * GH), ridge = new Uint8Array(GW * GH), blockedG = new Uint8Array(GW * GH);
  const gIndex = (X, z) => { const u = (X / WN + 0.5), v = (z - 1) / (ZF - 1); if (u < 0 || u >= 1 || v < 0 || v >= 1) return -1; return Math.floor(v * GH) * GW + Math.floor(u * GW); };
  const gCenter = k => { const gu = k % GW, gv = Math.floor(k / GW); return { X: ((gu + 0.5) / GW - 0.5) * WN, z: 1 + (gv + 0.5) / GH * (ZF - 1) }; };

  // ---------- scenery ----------
  let rocks = [], trees = [], lantern = null, mtns = [], specks;
  function layout() {
    const tall = innerHeight > innerWidth * 1.2;      // phones held upright
    ZF = tall ? 2.5 : 4.2;
    yH = Math.round(innerHeight * (tall ? 0.33 : 0.3));
    const bottomBar = document.getElementById('tools').offsetHeight + 24;
    yB = innerHeight - bottomBar;
    cx = innerWidth / 2;
    WN = Math.min(innerWidth * 0.98, (yB - yH) * 3.4);
    DEPTH = (yB - yH) * 0.9;
    const R = seeded(prefs.seed);
    rocks = []; trees = []; blockedG.fill(0);
    const taken = [];
    const free = (X, z, r) => taken.every(o => Math.hypot(o.X - X, (o.z - z) * DEPTH) > (o.r + r) * 1.15);
    const spot = (r, zMin, zMax, xSpread = 0.4) => {
      for (let k = 0; k < 200; k++) { const z = zMin + R() * (zMax - zMin), X = (R() - 0.5) * 2 * halfW() * xSpread * 2 * 0.9; if (Math.abs(X) < halfW() - r * 1.2 && free(X, z, r)) return { X, z }; }
      return null;
    };
    const sz = WN / 1000 * (tall ? 2.7 : 1.9);
    // rocks, big and small
    const nR = innerWidth < 700 ? 4 : 5;
    for (let k = 0; k < nR; k++) {
      const r = (k < 2 ? 60 : 30 + R() * 30) * sz * 1.1, p = spot(r, 1.25, ZF - 0.3, 0.5);
      if (!p) continue;
      rocks.push({ ...p, r, h: 0.55 + R() * 0.6, lean: (R() - 0.5) * 0.4, bump: [R() * 6, R() * 6], mossy: R() < 0.7 }); taken.push({ ...p, r });
    }
    // little trees: two maples and a pine, toward the back so you can rake in front of them
    for (const kind of ['maple', 'pine', 'maple']) {
      const r = (kind === 'pine' ? 90 : 115) * sz, p = spot(r * 0.5, Math.min(1.7, ZF - 0.6), Math.min(3.0, ZF - 0.15), 0.5);
      if (!p) continue;
      trees.push({ ...p, r, kind, seed: R() * 10 }); taken.push({ ...p, r: r * 0.5 });
    }
    // a stone lantern
    const lp = spot(40 * sz, Math.min(1.5, ZF - 0.7), Math.min(2.6, ZF - 0.2), 0.5);
    lantern = lp ? { ...lp, r: 28 * sz } : null; if (lp) taken.push({ ...lp, r: 30 * sz });
    // mark the ground the rake can't go over
    for (let k = 0; k < GW * GH; k++) {
      const c = gCenter(k);
      for (const o of [...rocks.map(r => ({ X: r.X, z: r.z, r: r.r * 1.05 })), ...trees.map(t => ({ X: t.X, z: t.z, r: t.r * 0.18 })), ...(lantern ? [{ X: lantern.X, z: lantern.z, r: lantern.r * 1.1 }] : [])])
        if (Math.hypot(c.X - o.X, (c.z - o.z) * DEPTH) < o.r) { blockedG[k] = 1; break; }
    }
    // distant mountains
    mtns = [];
    for (let k = 0; k < 7; k++) mtns.push({ x: R() * innerWidth, w: innerWidth * (tall ? 0.5 + R() * 0.4 : 0.15 + R() * 0.25), h: innerHeight * (0.06 + R() * 0.1), far: R() < 0.5 });
    specks = new Float32Array(GW * GH).map(() => Math.random());
  }
  function resize() {
    const dpr = devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${FONT_PX}px ui-monospace, Menlo, Consolas, monospace`; ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width; ch = FONT_PX;
    cols = Math.ceil(innerWidth / cw); rows = Math.ceil(innerHeight / ch);
    const n = cols * rows; cellCh = new Array(n); cellCol = new Array(n); cellPri = new Float32Array(n);
    const firstTime = WN === undefined;
    layout();
    if (firstTime) restore(); else for (const L of leaves) if (Math.abs(L.X) > halfW()) L.gone = 1;
    updateCount();
  }

  // ---------- leaves (stored on the ground) ----------
  const leaves = [], falling = [];
  const LEAF = [{ c: '&', col: '#d9542b' }, { c: '%', col: '#e8862e' }, { c: '*', col: '#e9b23a' }, { c: '@', col: '#b5452a' }, { c: '&', col: '#a8632f' }, { c: '*', col: '#f0a23a' }];
  const makeLeaf = (X, z, k) => ({ X, z, vx: 0, vz: 0, k: k ?? (Math.random() * LEAF.length | 0), gone: 0 });
  function scatterLeaves(n) {
    for (let i = 0; i < n; i++) for (let t = 0; t < 20; t++) {
      const z = 1.05 + Math.random() * (ZF - 1.15), X = (Math.random() - 0.5) * 2 * halfW() * 0.97, k = gIndex(X, z);
      if (k >= 0 && !blockedG[k]) { leaves.push(makeLeaf(X, z)); break; }
    }
  }
  let cleanedToast = false;
  function updateLeaves() {
    for (let i = leaves.length - 1; i >= 0; i--) {
      const L = leaves[i];
      if (L.gone) { if (++L.gone > 40) { leaves.splice(i, 1); updateCount(); } continue; }
      if (Math.abs(L.vx) + Math.abs(L.vz) * DEPTH < 0.03) continue;
      const nX = L.X + L.vx, nz = L.z + L.vz, k = gIndex(nX, nz);
      if (k >= 0 && blockedG[k]) { L.vx *= -0.4; L.vz *= -0.4; } else { L.X = nX; L.z = nz; }
      L.vx *= 0.86; L.vz *= 0.86;
      if (!onSand(L.X, L.z)) { L.gone = 1; sfx.whisk(); }
    }
    // maple leaves float down from the branches onto the sand
    if (Math.random() < 0.005) {
      const ms = trees.filter(t => t.kind === 'maple'), t = ms[Math.random() * ms.length | 0];
      if (t) { const base = toScreen(t.X, t.z), R = t.r / t.z;
        const X = t.X + rnd(-1, 1) * t.r * 1.6, z = Math.max(1.05, Math.min(ZF - 0.05, t.z + rnd(-0.5, 0.6)));
        falling.push({ sx: base.x + rnd(-R, R), sy: base.y - R * 1.6 + rnd(-R * 0.4, R * 0.4), X, z, t: 0, dur: rnd(150, 240), k: Math.random() * LEAF.length | 0, ph: Math.random() * 6 }); }
    }
    for (let i = falling.length - 1; i >= 0; i--) {
      const f = falling[i]; if (++f.t >= f.dur) { falling.splice(i, 1); const k = gIndex(f.X, f.z); if (k >= 0 && !blockedG[k] && onSand(f.X, f.z)) { leaves.push(makeLeaf(f.X, f.z, f.k)); updateCount(); } }
    }
    const left = leaves.filter(L => !L.gone).length;
    if (left === 0 && !cleanedToast) { cleanedToast = true; toast('the garden is clean ✿ now rake some patterns'); sfx.chime(); }
    if (left > 3) cleanedToast = false;
  }
  const countEl = document.getElementById('count');
  function updateCount() { const n = leaves.filter(L => !L.gone).length; countEl.textContent = n ? (innerWidth < 700 ? `${n} leaves` : `${n} leaves to rake`) : 'all clean ✿'; }

  // ---------- raking (all done on the ground, so lines get thinner far away) ----------
  let tool = 'rake', hover = null, lastDir = 0, dragging = false, lastG = null, rakeSpeed = 0;
  const TOOL = { rake: { half: 32, sp: 9 }, fine: { half: 14, sp: 5 }, smooth: { half: 30, sp: 9 } };
  function rakeStroke(a, b) {          // a, b = ground points {X, z}
    const ax = a.X, ay = gY(a.z), bx = b.X, by = gY(b.z), dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy);
    if (len < 0.5) return;
    const ux = dx / len, uy = dy / len, nx = -uy, ny = ux, T = TOOL[tool], half = T.half * WN / 1000 * 1.6, sp = T.sp * WN / 1000 * 1.6;
    const ang = Math.atan2(dy, dx), code = 1 + ((Math.round(ang / (Math.PI / 8)) % 8) + 8) % 8;   // 8 directions (lines look the same both ways)
    const minX = Math.min(ax, bx) - half, maxX = Math.max(ax, bx) + half, minY = Math.min(ay, by) - half, maxY = Math.max(ay, by) + half;
    const u0 = Math.max(0, Math.floor((minX / WN + 0.5) * GW)), u1 = Math.min(GW - 1, Math.ceil((maxX / WN + 0.5) * GW));
    const v0 = Math.max(0, Math.floor((minY / DEPTH - 1) / (ZF - 1) * GH)), v1 = Math.min(GH - 1, Math.ceil((maxY / DEPTH - 1) / (ZF - 1) * GH));
    for (let gv = v0; gv <= v1; gv++) for (let gu = u0; gu <= u1; gu++) {
      const k = gv * GW + gu; if (blockedG[k]) continue;
      const c = gCenter(k), px = c.X - ax, py = gY(c.z) - ay, along = px * ux + py * uy, d = px * nx + py * ny;
      if (along < -sp || along > len + sp || Math.abs(d) > half) continue;
      if (tool === 'smooth') { groove[k] = 0; continue; }
      groove[k] = code; ridge[k] = Math.floor((d + half) / sp) % 2;
    }
    // the rake pushes leaves along in front of it
    for (const L of leaves) {
      if (L.gone) continue;
      const px = L.X - ax, py = gY(L.z) - ay, along = px * ux + py * uy, d = px * nx + py * ny;
      if (along > -sp && along < len + sp * 3 && Math.abs(d) < half * 1.1) {
        const nXp = L.X + dx * 0.92, nz = L.z + (dy * 0.92) / DEPTH, k2 = gIndex(nXp, nz);
        if (k2 < 0 || !blockedG[k2]) { L.X = nXp; L.z = nz; }
        L.vx = ux * Math.min(4, len) * 0.3 + nx * Math.sign(d) * 0.2; L.vz = (uy * Math.min(4, len) * 0.3 + ny * Math.sign(d) * 0.2) / DEPTH;
        if (Math.random() < 0.05) sfx.rustle();
      }
    }
    lastDir = ang;
  }

  // ---------- drawing ----------
  const SAND = '#e6d5b3', SAND_DK = '#a88d62', SAND_LT = '#fff8ea', HAZE = '#efe3cb';
  function skyColors() {
    const top = mix(mix('#141a33', '#9cc4e4', day), '#f2b8a0', warm * 0.5), bot = mix(mix('#3a3150', '#e7f0f4', day), '#ffd39b', warm * 0.7);
    return [top, bot];
  }
  function drawBackground(t) {
    const [top, bot] = skyColors();
    const g = ctx.createLinearGradient(0, 0, 0, yH); g.addColorStop(0, top); g.addColorStop(1, bot);
    ctx.fillStyle = g; ctx.fillRect(0, 0, innerWidth, yH + 2);
    // distant mountains: soft layered shapes
    if (wallRect) {
      const base = wallRect.y0 - 3 * ch;
      for (const far of [true, false]) {
        ctx.fillStyle = mix(mix(far ? '#b7c6d4' : '#93a7b9', '#262b40', 1 - day), '#e8b49a', warm * 0.35);
        for (const m of mtns) { if (m.far !== far) continue;
          ctx.beginPath(); ctx.moveTo(m.x - m.w / 2, base + 2); ctx.quadraticCurveTo(m.x - m.w * 0.15, base - m.h * 1.05, m.x, base - m.h);
          ctx.quadraticCurveTo(m.x + m.w * 0.18, base - m.h * 0.95, m.x + m.w / 2, base + 2); ctx.fill(); }
      }
    }
    if (wallRect) { ctx.fillStyle = mix(mix('#e9dcc4', '#3d3746', 1 - day), '#f4cfa0', warm * 0.3); ctx.fillRect(0, wallRect.y0, innerWidth, wallRect.y1 - wallRect.y0); }
    // ground around the sand: soft moss
    const gTop = wallRect ? wallRect.y1 : yH;
    ctx.fillStyle = mix(mix('#2c3a26', '#6f8a4e', day), '#8a7a4a', warm * 0.2); ctx.fillRect(0, gTop, innerWidth, innerHeight - gTop);
    // sand area (trapezoid)
    const fl = toScreen(-halfW(), 1), fr = toScreen(halfW(), 1), bl = toScreen(-halfW(), ZF), br = toScreen(halfW(), ZF);
    const sg = ctx.createLinearGradient(0, bl.y, 0, fl.y);
    const night = 1 - day;
    sg.addColorStop(0, mix(mix(HAZE, '#4a4558', night * 0.8), '#f4cf9e', warm * 0.3)); sg.addColorStop(1, mix(mix(SAND, '#5a5262', night * 0.75), '#efc08a', warm * 0.25));
    ctx.fillStyle = sg; ctx.beginPath(); ctx.moveTo(bl.x, bl.y); ctx.lineTo(br.x, br.y); ctx.lineTo(fr.x, fr.y); ctx.lineTo(fl.x, fl.y); ctx.closePath(); ctx.fill();
  }
  function shade(col, z) { const far = (z - 1) / (ZF - 1); return mix(mix(col, HAZE, far * 0.45), '#2a2638', (1 - day) * 0.55); }
  function drawScene(t) {
    cellPri.fill(0);
    // mountains & the garden wall
    const backY = toScreen(0, ZF).y, mrow = Math.floor(backY / ch);
    for (const m of mtns) {     // just a few little peaks drawn on top of the soft mountain shapes
      const base = (mrow - 6) * ch, peak = Math.floor((base - m.h) / ch);
      put(Math.floor(m.x / cw), peak, '^', mix(m.far ? '#9db0c2' : '#7f93a6', '#1c2133', (1 - day) * 0.7), 6);
    }
    // a low clay wall with a tiled roof behind the garden
    const wallTop = mrow - 6;
    for (let x = 0; x < cols; x++) {
      put(x, wallTop, x % 2 ? '_' : '/', mix('#4f4b58', '#1c1b26', (1 - day) * 0.6), 20);
      put(x, wallTop + 1, x % 2 ? '\\' : '_', mix('#5e5a66', '#1c1b26', (1 - day) * 0.6), 20);
      put(x, wallTop + 2, x % 4 ? '=' : 'H', mix('#7a7684', '#25232f', (1 - day) * 0.6), 20);
      for (let y = wallTop + 3; y < mrow; y++) put(x, y, (x * 5 + y * 3) % 13 === 0 ? '.' : (x % 18 === 0 ? '|' : ' '), mix('#bfa98a', '#3a3542', (1 - day) * 0.6), 20);
    }
    wallRect = { y0: (wallTop + 3) * ch, y1: mrow * ch };
    // the sand: grooves and specks, drawn by looking up each screen cell on the ground
    const y0 = Math.ceil(toScreen(0, ZF).y / ch), y1 = Math.floor(yB / ch);
    for (let gy = y0; gy <= y1; gy++) {
      const g = toGround(0, (gy + 0.5) * ch); if (!g) continue;
      const z = g.z, far = (z - 1) / (ZF - 1);
      for (let gx = 0; gx < cols; gx++) {
        const X = ((gx + 0.5) * cw - cx) * z;
        if (!onSand(X, z)) {
          // stone edging along the sides and front, moss everywhere else
          const edge = Math.abs(Math.abs(X) - halfW()) < 12 * z || (z < 1 && z > 0.96 && Math.abs(X) < halfW());
          if (edge && z <= ZF) put(gx, gy, 'o', shade('#9a948a', z), 80);
          else if ((gx * 7 + gy * 13) % 9 === 0) put(gx, gy, (gx + gy) % 2 ? '"' : ',', mix(mix('#4d6a3a', '#9ab36a', day), '#1d2a1a', 0), 60);
          continue;
        }
        const k = gIndex(X, z); if (k < 0) continue;
        if (groove[k]) {
          // turn the groove's ground direction into a screen direction (perspective)
          const a = (groove[k] - 1) * Math.PI / 8, dX = Math.cos(a), dY = Math.sin(a), dz = dY / DEPTH;
          const sx = dX / z - X / (z * z) * dz, sy = -(yB - yH) / (z * z) * dz;
          let A = Math.atan2(sy, sx); A = ((A % Math.PI) + Math.PI) % Math.PI;
          const c = A < Math.PI / 8 || A > Math.PI * 7 / 8 ? (far > 0.6 ? '-' : '~') : A > Math.PI * 3 / 8 && A < Math.PI * 5 / 8 ? '|' : A < Math.PI / 2 ? '\\' : '/';
          put(gx, gy, c, shade(ridge[k] ? SAND_LT : SAND_DK, z), 100);
        } else if (specks[k] < 0.08 + far * 0.04) put(gx, gy, specks[k] < 0.03 ? ',' : '.', shade('#c9b78f', z), 90);
      }
    }
    // things standing in the garden, drawn back to front
    const things = [...rocks.map(o => ({ o, kind: 'rock' })), ...trees.map(o => ({ o, kind: 'tree' })), ...(lantern ? [{ o: lantern, kind: 'lantern' }] : [])];
    things.sort((a, b) => b.o.z - a.o.z);
    shadows = [];
    for (const th of things) {
      const pri = 200 + (1 - (th.o.z - 1) / (ZF - 1)) * 600;
      if (th.kind === 'rock') drawRock(th.o, pri); else if (th.kind === 'tree') drawTree(th.o, pri, t); else drawLantern(th.o, pri, t);
    }
    // leaves on the sand
    for (const L of leaves) {
      const p = toScreen(L.X, L.z), lf = LEAF[L.k], pri = 190 + (1 - (L.z - 1) / (ZF - 1)) * 600;
      put(Math.floor(p.x / cw), Math.floor(p.y / ch), lf.c, L.gone ? mix(lf.col, SAND, L.gone / 40) : shade(lf.col, L.z), pri);
    }
    // leaves drifting down
    for (const f of falling) {
      const p = f.t / f.dur, end = toScreen(f.X, f.z);
      const x = f.sx + (end.x - f.sx) * p + Math.sin(f.t * 0.08 + f.ph) * 14, y = f.sy + (end.y - f.sy) * (p * p * 0.4 + p * 0.6);
      put(Math.floor(x / cw), Math.floor(y / ch), LEAF[f.k].c, LEAF[f.k].col, 950);
    }
    if (hover) drawRake(hover);
  }
  let shadows = [], wallRect = null;
  function drawRock(r, pri) {
    const b = toScreen(r.X, r.z), W = r.r / r.z, H = r.r * r.h * 1.1 / r.z;
    shadows.push({ x: b.x + W * 0.25, y: b.y, rx: W * 1.2, ry: Math.max(3, W * 0.22) });
    for (let gy = Math.floor((b.y - H * 1.1) / ch); gy <= Math.ceil(b.y / ch); gy++) for (let gx = Math.floor((b.x - W * 1.2) / cw); gx <= Math.ceil((b.x + W * 1.2) / cw); gx++) {
      const px = (gx + 0.5) * cw, py = (gy + 0.5) * ch;
      const v = (b.y - py) / H; if (v < -0.08) continue;
      const u = (px - b.x) / W - r.lean * v;
      const top = Math.sqrt(Math.max(0, 1 - u * u)) * (1 + 0.1 * Math.sin(u * 4 + r.bump[0]) + 0.06 * Math.sin(u * 9 + r.bump[1]));
      if (Math.abs(u) > 1 || v > top) continue;
      const light = -u * 0.55 + (v / Math.max(0.01, top)) * 0.6;
      const edge = v > top - 0.12 || Math.abs(u) > 0.9;
      let c = light > 0.55 ? '@' : light > 0.15 ? '%' : light > -0.25 ? '#' : '&', col = light > 0.55 ? '#d2ccc2' : light > 0.15 ? '#aaa59c' : light > -0.25 ? '#86817a' : '#68645e';
      if (edge) { c = 'o'; col = '#77736c'; }
      if (r.mossy && v > top - 0.3 && u < 0.4 && Math.sin(gx * 2.1 + gy * 3.3 + r.bump[0]) > 0.2) { c = '"'; col = '#7f9a54'; }
      put(gx, gy, c, shade(col, r.z), pri);
    }
  }
  function drawTree(tr, pri, t) {
    const b = toScreen(tr.X, tr.z), S = tr.r / tr.z, sway = Math.sin(t * 0.0008 + tr.seed) * S * 0.05;
    shadows.push({ x: b.x + S * 0.2, y: b.y, rx: S * 0.9, ry: Math.max(3, S * 0.18) });
    const trunkH = tr.kind === 'pine' ? S * 0.5 : S * 0.9;
    // trunk
    for (let gy = Math.floor((b.y - trunkH) / ch); gy <= Math.floor(b.y / ch); gy++) {
      const p = (b.y - gy * ch) / trunkH, x = b.x + sway * p + Math.sin(p * 3 + tr.seed) * S * 0.04;
      put(Math.floor(x / cw), gy, '|', shade('#5a3a26', tr.z), pri + 1);
      if (S > 40) put(Math.floor(x / cw) + 1, gy, '|', shade('#6e4a30', tr.z), pri + 1);
    }
    if (tr.kind === 'maple') {
      // a few branches and a puffy canopy of red & orange leaves
      const cyy = b.y - trunkH - S * 0.35, R = S * 0.85;
      for (const [dx, dy] of [[-0.45, 0.15], [0.45, 0.1], [0, -0.1]]) for (let k = 0; k < 4; k++) put(Math.floor((b.x + dx * S * k / 4) / cw), Math.floor((b.y - trunkH + dy * S - k * 2) / ch), dx < 0 ? '\\' : dx > 0 ? '/' : '|', shade('#5a3a26', tr.z), pri + 1);
      const pal = ['#9e3420', '#c94a28', '#e2702f', '#f0a040'];
      for (let gy = Math.floor((cyy - R * 0.75) / ch); gy <= Math.ceil((cyy + R * 0.55) / ch); gy++) for (let gx = Math.floor((b.x - R * 1.35) / cw); gx <= Math.ceil((b.x + R * 1.35) / cw); gx++) {
        const u = ((gx + 0.5) * cw - b.x - sway) / (R * 1.3), v = ((gy + 0.5) * ch - cyy) / (R * 0.68), a = Math.atan2(v, u);
        const lobes = 0.82 + 0.12 * Math.sin(a * 5 + tr.seed) + 0.08 * Math.sin(a * 9 + tr.seed * 2);
        const d = Math.hypot(u, v) / lobes; if (d > 1) continue;
        const n = Math.sin(gx * 1.9 + gy * 2.7 + tr.seed * 3) * 0.5 + 0.5, light = -u * 0.35 - v * 0.5 + n * 0.35;
        const c = d > 0.86 ? '*' : n > 0.62 ? '&' : n > 0.3 ? '%' : '@';
        put(gx, gy, c, shade(pal[Math.max(0, Math.min(3, Math.floor((light + 0.55) * 2.6)))], tr.z), pri + 2);
      }
      tr.canopy = { x: b.x, y: cyy, R };
    } else {
      // a little pine in three tiers
      const pal = ['#2f5a33', '#3f7340', '#558c4f', '#73a760'];
      for (let tier = 0; tier < 3; tier++) {
        const base = b.y - trunkH - tier * S * 0.42, w = S * (0.95 - tier * 0.25), h = S * 0.55;
        for (let gy = Math.floor((base - h) / ch); gy <= Math.floor(base / ch); gy++) {
          const p = (base - gy * ch) / h, hw = w * (1 - p);
          for (let gx = Math.floor((b.x - hw) / cw); gx <= Math.ceil((b.x + hw) / cw); gx++) {
            const u = ((gx + 0.5) * cw - b.x - sway * (tier + 1)) / Math.max(1, hw); if (Math.abs(u) > 1) continue;
            const c = u < -0.8 ? '/' : u > 0.8 ? '\\' : (gx + gy) % 2 ? '^' : '*';
            put(gx, gy, c, shade(pal[Math.max(0, Math.min(3, Math.floor((-u * 0.5 + p * 0.6 + 0.5) * 3)))], tr.z), pri + 2 + tier);
          }
        }
      }
    }
  }
  function drawLantern(L, pri, t) {
    const b = toScreen(L.X, L.z), s = Math.max(0.7, 2.6 / L.z);
    const art = s > 0.9 ? ['  _/^^\\_', ' /______\\', '  |    |', '  | [] |', '  |____|', '    ||', '  [====]'] : [' _/^\\_', ' /___\\', '  |o|', '  |_|', '   |', '  [=]'];
    const lit = (1 - day) > 0.3 || warm > 0.5;
    const x0 = Math.floor(b.x / cw) - Math.floor(art[0].length / 2), yy0 = Math.floor(b.y / ch) - art.length + 1;
    art.forEach((row, r) => { for (let i = 0; i < row.length; i++) if (row[i] !== ' ') {
      const glow = lit && (row[i] === '[' || row[i] === ']' || row[i] === 'o') && r >= 2 && r <= 3;
      put(x0 + i, yy0 + r, row[i], glow ? '#ffd27a' : shade(r < 2 ? '#6f6a62' : '#857f75', L.z), pri); } });
    if (lit) lanternGlow = { x: b.x, y: (yy0 + 3) * ch, r: 60 * s };
    else lanternGlow = null;
    shadows.push({ x: b.x + 4, y: b.y, rx: 18 * s, ry: 4 });
  }
  let lanternGlow = null;
  function drawRake(p) {
    const g = toGround(p.x, p.y); if (!g) return;
    const T = TOOL[tool], half = T.half * WN / 1000 * 1.6, a = lastDir, nx = -Math.sin(a), ny = Math.cos(a);
    // the rake head lies on the ground, so it shrinks with distance too
    const n = 7;
    for (let k = -n; k <= n; k++) {
      const off = half * k / n, gX = g.X + nx * off, gz = g.z + ny * off / DEPTH, s = toScreen(gX, gz);
      put(Math.floor(s.x / cw), Math.floor(s.y / ch), tool === 'smooth' ? '=' : (k % 2 === 0 ? 'H' : '='), tool === 'smooth' ? '#e6d5b3' : '#6e4a2e', 990);
    }
    // the handle comes up toward you
    const s0 = toScreen(g.X, g.z);
    for (let k = 1; k <= 12; k++) put(Math.floor((s0.x + k * cw * 0.6) / cw), Math.floor((s0.y + k * ch * 0.75) / ch), '\\', '#a2774e', 985);
  }

  function render(t) {
    drawBackground(t);
    drawScene(t);
    // soft contact shadows under everything
    for (const s of shadows) {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.rx);
      g.addColorStop(0, 'rgba(90, 70, 40, .28)'); g.addColorStop(1, 'rgba(90, 70, 40, 0)');
      ctx.save(); ctx.translate(s.x, s.y); ctx.scale(1, s.ry / s.rx); ctx.translate(-s.x, -s.y); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, s.rx, 0, 7); ctx.fill(); ctx.restore();
    }
    const buckets = new Map();
    for (let i = 0; i < cellPri.length; i++) { if (cellPri[i] <= 0) continue; let b = buckets.get(cellCol[i]); if (!b) buckets.set(cellCol[i], b = []); b.push(i); }
    for (const [col, arr] of buckets) { ctx.fillStyle = col; for (const i of arr) ctx.fillText(cellCh[i], (i % cols) * cw, Math.floor(i / cols) * ch); }
    if (lanternGlow) { const g = ctx.createRadialGradient(lanternGlow.x, lanternGlow.y, 0, lanternGlow.x, lanternGlow.y, lanternGlow.r * 2.4);
      g.addColorStop(0, 'rgba(255, 200, 110, .35)'); g.addColorStop(1, 'rgba(255, 200, 110, 0)'); ctx.fillStyle = g; ctx.fillRect(lanternGlow.x - lanternGlow.r * 2.4, lanternGlow.y - lanternGlow.r * 2.4, lanternGlow.r * 4.8, lanternGlow.r * 4.8); }
    // warm light over everything
    const g = ctx.createRadialGradient(innerWidth * 0.3, 0, 0, innerWidth * 0.3, 0, innerWidth);
    g.addColorStop(0, `rgba(255, 238, 205, ${0.1 * day})`); g.addColorStop(1, 'rgba(40, 30, 20, .1)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, innerWidth, innerHeight);
  }

  // ---------- sound (all made in the browser) ----------
  let actx = null, master = null, scratchGain = null, scratchFilter = null, noiseBuf = null;
  function ensureAudio() {
    if (actx) return actx;
    try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
    master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
    noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const nd = noiseBuf.getChannelData(0);
    // grainy noise: lots of tiny clicks, like sand under a rake
    for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (Math.random() < 0.3 ? 1 : 0.25);
    const src = actx.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    scratchFilter = actx.createBiquadFilter(); scratchFilter.type = 'bandpass'; scratchFilter.frequency.value = 2200; scratchFilter.Q.value = 0.8;
    scratchGain = actx.createGain(); scratchGain.gain.value = 0;
    src.connect(scratchFilter).connect(scratchGain).connect(master); src.start();
    // a soft breeze
    const wind = actx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
    const wl = actx.createBiquadFilter(); wl.type = 'lowpass'; wl.frequency.value = 350;
    const wg = actx.createGain(); wg.gain.value = 0.05;
    wind.connect(wl).connect(wg).connect(master); wind.start(0, 0.5);
    // wind chimes and the bamboo fountain now and then
    const chimes = () => { if (live() && Math.random() < 0.6) sfx.chime(); setTimeout(chimes, rnd(9000, 20000)); };
    const bamboo = () => { if (live()) sfx.bamboo(); setTimeout(bamboo, rnd(30000, 60000)); };
    setTimeout(chimes, 4000); setTimeout(bamboo, 12000);
    return actx;
  }
  const live = () => prefs.volume > 0 && actx && actx.state === 'running';
  function tone(f, vol, dur, rise = 1, when = 0, type = 'sine') {
    if (!live()) return;
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(f * rise, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + Math.min(0.01, dur / 4)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(master); o.start(t); o.stop(t + dur + 0.05);
  }
  function burst(freq, vol, dur, type = 'bandpass') {
    if (!live()) return;
    const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = freq; f.Q.value = 0.9;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(master); s.start(t, Math.random()); s.stop(t + dur + 0.02);
  }
  const sfx = {
    rustle: () => { burst(rnd(3000, 6000), 0.12, rnd(0.08, 0.16), 'highpass'); },
    whisk: () => { burst(2500, 0.15, 0.25, 'highpass'); },
    chime: () => { const notes = [1046.5, 1174.7, 1318.5, 1568, 1760]; for (let k = 0; k < 3; k++) tone(notes[Math.random() * 5 | 0], 0.05, 2.6, 1, k * rnd(0.15, 0.4)); },
    bamboo: () => { burst(900, 0.3, 0.05); tone(420, 0.18, 0.12, 0.9, 0.005, 'triangle'); tone(140, 0.15, 0.25, 0.8, 0.01); setTimeout(() => burst(1400, 0.06, 0.6, 'lowpass'), 300); },
  };
  function setScratch(speed) {
    if (!scratchGain) return;
    const t = actx.currentTime;
    const amt = tool === 'smooth' ? Math.min(0.25, speed * 0.02) : Math.min(0.5, speed * 0.035);
    scratchGain.gain.setTargetAtTime(dragging ? amt : 0, t, 0.05);
    scratchFilter.frequency.setTargetAtTime(tool === 'fine' ? 3400 : tool === 'smooth' ? 1200 : 2200 + speed * 40, t, 0.05);
  }
  const vol = document.getElementById('vol'), sndLbl = document.getElementById('sndLbl');
  function applySound() {
    sndLbl.textContent = prefs.volume > 0 ? `sound ${Math.round(prefs.volume * 100)}%` : 'sound off';
    if (prefs.volume <= 0) { if (actx) master.gain.setTargetAtTime(0, actx.currentTime, 0.1); return; }
    const a = ensureAudio(); if (!a) return; a.resume().catch(() => {});
    master.gain.setTargetAtTime(prefs.volume * 1.1, a.currentTime, 0.15);
  }
  vol.value = prefs.volume;
  vol.addEventListener('input', () => { prefs.volume = +vol.value; save(); applySound(); });
  let lastVol = prefs.volume || 0.6;



  // ---------- saving ----------
  let saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      let g = ''; for (let i = 0; i < groove.length; i++) g += String.fromCharCode(48 + groove[i] * 2 + ridge[i]);
      try { localStorage.setItem(STORE, JSON.stringify({ prefs, garden: { seed: prefs.seed, g, leaves: leaves.filter(L => !L.gone).map(L => ({ X: +(L.X / WN).toFixed(4), z: +L.z.toFixed(3), k: L.k })) } })); } catch (e) {}
    }, 400);
  }
  function restore() {
    const gd = saved.garden;
    if (gd && gd.seed === prefs.seed && gd.g && gd.g.length === groove.length) {
      for (let i = 0; i < groove.length; i++) { const v = gd.g.charCodeAt(i) - 48; groove[i] = v >> 1; ridge[i] = v & 1; }
      for (const L of gd.leaves || []) leaves.push(makeLeaf(L.X * WN, L.z, L.k));
    } else scatterLeaves(innerWidth < 700 ? 30 : 55);
  }

  // ---------- toast & clock ----------
  const toastEl = document.getElementById('toast'); let toastT;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2800); }
  const clockEl = document.getElementById('clock');
  const DAYS = ['sunday', 'monday', 'tuesday', 'wednesday', 'thursday', 'friday', 'saturday'];
  function tick() { const d = new Date(); let h = d.getHours(); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12;
    clockEl.textContent = `${h}:${String(d.getMinutes()).padStart(2, '0')} ${ap}` + (innerWidth < 700 ? '' : ` · ${DAYS[d.getDay()]}`); }
  tick(); setInterval(tick, 10000);



  // ---------- loop ----------
  function frame(now) {
    if (Math.floor(now / 30000) !== Math.floor((now - 16) / 30000)) { day = daylight(); warm = Math.min(1, warmth()); }
    updateLeaves();
    rakeSpeed *= 0.85; if (actx) setScratch(rakeSpeed);
    render(now);
    requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  applySound();
  requestAnimationFrame(frame);

  // ---------- input ----------
  canvas.addEventListener('pointerdown', e => {
    if (prefs.volume > 0) applySound();
    dragging = true; hover = { x: e.clientX, y: e.clientY }; lastG = toGround(e.clientX, e.clientY);
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener('pointermove', e => {
    const p = { x: e.clientX, y: e.clientY }; hover = p;
    if (!dragging) return;
    const g = toGround(p.x, p.y); if (!g) return;
    if (!lastG) { lastG = g; return; }
    const d = Math.hypot(g.X - lastG.X, (g.z - lastG.z) * DEPTH);
    if (d < 2) return;
    // split long moves into small steps so the lines stay smooth
    const steps = Math.ceil(d / 12);
    for (let k = 1; k <= steps; k++) {
      const a = { X: lastG.X + (g.X - lastG.X) * (k - 1) / steps, z: lastG.z + (g.z - lastG.z) * (k - 1) / steps };
      const b = { X: lastG.X + (g.X - lastG.X) * k / steps, z: lastG.z + (g.z - lastG.z) * k / steps };
      rakeStroke(a, b);
    }
    rakeSpeed = Math.max(rakeSpeed * 0.6, Math.hypot(p.x - (hover.px || p.x), 0) + d / Math.max(1, g.z) * 0.6);
    lastG = g;
  });
  const end = () => { if (dragging) save(); dragging = false; lastG = null; };
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', () => { if (!dragging) hover = null; });

  function setTool(t) {
    tool = t; document.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    toast({ rake: 'rake: wide, calm lines', fine: 'fine rake: thin little lines', smooth: 'smooth: flatten the sand' }[t]);
  }
  document.querySelectorAll('[data-tool]').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
  document.getElementById('leavesBtn').addEventListener('click', () => { scatterLeaves(innerWidth < 700 ? 22 : 40); updateCount(); save(); toast('a gust of wind… fresh leaves!'); sfx.rustle(); sfx.rustle(); });
  document.getElementById('resetBtn').addEventListener('click', () => {
    groove.fill(0); ridge.fill(0); leaves.length = 0; scatterLeaves(innerWidth < 700 ? 30 : 55); updateCount(); save(); toast('fresh, smooth sand'); sfx.chime();
  });
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === '1') setTool('rake'); else if (k === '2') setTool('fine'); else if (k === '3') setTool('smooth');
    else if (k === 'm') { if (prefs.volume > 0) { lastVol = prefs.volume; prefs.volume = 0; } else prefs.volume = lastVol; vol.value = prefs.volume; save(); applySound(); toast(prefs.volume > 0 ? 'sound on' : 'sound off'); }
  });
})();
</script>
</body>
